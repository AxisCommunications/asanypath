repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.4
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    # Mirror the CI Rust checks (.github/workflows/unittests.yml).
    - id: cargo-fmt
      name: cargo fmt (rust)
      entry: cargo fmt --manifest-path rust/Cargo.toml --check
      language: system
      files: ^rust/.*\.rs$
      pass_filenames: false
    - id: cargo-check
      name: cargo check (rust)
      entry: cargo check --manifest-path rust/Cargo.toml --locked
      language: system
      files: ^rust/.*\.(rs|toml|lock)$
      pass_filenames: false