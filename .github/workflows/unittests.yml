name: Unit test, lint and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Check crate
        run: cargo check --manifest-path rust/Cargo.toml --locked

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Ruff checks
        run: uvx ruff check src tests && uvx ruff format --check src tests

      - name: Create virtual environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install project and native extension
        run: uv pip install -e ".[dev]"

      - name: Test with pytest and coverage
        env:
          PYTHONUNBUFFERED: 1
        run: uv run --no-sync python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=90 tests