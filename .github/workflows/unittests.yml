name: Unit test, lint and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Ruff checks
        run: uvx ruff check src tests && uvx ruff format --check src tests

      - name: Install project and native extension
        run: uv pip install -e ".[dev]"

      - name: Test with pytest and coverage
        env:
          PYTHONUNBUFFERED: 1
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=90 tests